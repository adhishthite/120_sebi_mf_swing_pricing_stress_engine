name: CI/CD Quality & Governance Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-format:
    name: Code Quality & Linting (Ruff & Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Lint Backend Code (Ruff)
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Lint Frontend Code (Biome)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome check src/

  backend-tests:
    name: Backend Test Suite & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: |
          uv sync
          PYTHONPATH=. uv run pytest -v

  evals-benchmark:
    name: Multi-Agent Benchmark Evals (Task Success >= 95%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Golden & Adversarial Benchmark Evaluations
        run: |
          cd backend && uv sync && cd ..
          cd backend && PYTHONPATH=. uv run python ../evals/run_evals.py

  terraform-validate:
    name: Infrastructure as Code (Terraform Validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Terraform Formatting
        working-directory: terraform
        run: terraform fmt -check

      - name: Initialize Terraform (No Backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        working-directory: terraform
        run: terraform validate
